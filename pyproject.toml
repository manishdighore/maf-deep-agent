[project]
name = "maf-deep-agent"
version = "0.1.6"
description = "Batteries-included agent builder with skills, compaction, todo, and delegation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Manish Dighore" },
]
keywords = ["agent", "llm", "ai", "skills", "delegation", "compaction", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "agent-framework>=1.3.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/manishdighore/maf-deep-agent"
Repository = "https://github.com/manishdighore/maf-deep-agent"
Documentation = "https://github.com/manishdighore/maf-deep-agent#readme"
Issues = "https://github.com/manishdighore/maf-deep-agent/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deep_agent"]
