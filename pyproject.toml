[project]
name = "maf-deep-agent"
version = "0.1.0"
description = "Batteries-included agent builder with skills, compaction, todo, and delegation"
requires-python = ">=3.11"
dependencies = [
    "agent-framework>=1.3.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deep_agent"]
